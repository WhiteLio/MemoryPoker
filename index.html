<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#293b49">
  <meta name="description" content="A daily game of memory and poker. Remember the cards. Pick the best hand.">
  <title>Memory Poker</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preload" href="./assets/fonts/MemoryPokerTimer.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles/welcome.css">
  <link rel="stylesheet" href="./styles/help.css">
</head>
<body>
  <nav id="menu-nav" class="menu-nav" aria-label="Game information"><div class="toolbar-inner">
    <button id="records" class="icon-button" aria-label="Records" title="Records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21V9h6v12M8 21V3h7v18M15 21V12h7v9ZM2 21h20"/></svg></button>
    <button id="help" class="icon-button" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 8.6a2.8 2.8 0 0 1 5.4 1c0 2-2.7 2.2-2.7 4.4M12 17v.2"/></svg></button>
  </div></nav>
  <main class="table">
    <section id="welcome" class="welcome">
    <header class="masthead">
      <p class="korean-title pointed-plaque" lang="ko"><span>기억 포커</span></p>
      <h1>Memory Poker</h1>
    </header>
      <p class="welcome-description">Remember the cards.<br>Pick the best hand.</p>
      <button id="enter-game" class="primary">Play</button>
      <footer><span id="difficulty"></span><span id="edition"></span><span id="next-deal"></span></footer>
      <div class="endless-entry-actions"><button id="endless-entry" class="text-button">Endless</button><button id="daily-entry" class="text-button" hidden>Daily game</button></div>
      <section id="unfinished" class="unfinished" hidden></section>
    </section>
    <nav id="puzzle-nav" class="puzzle-nav" aria-label="Game toolbar" hidden><button id="home" class="icon-button" aria-label="Back to home" title="Back to home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg></button><div class="puzzle-tools"><span id="endless-tools" hidden><button id="endless-skip" class="text-button">Next deal</button><button id="endless-toolbar" class="text-button" aria-label="Endless settings">Difficulty</button></span>
      <button id="puzzle-records" class="icon-button" aria-label="Records" title="Records"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21V9h6v12M8 21V3h7v18M15 21V12h7v9ZM2 21h20"/></svg></button>
      <button id="puzzle-help" class="icon-button" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 8.6a2.8 2.8 0 0 1 5.4 1c0 2-2.7 2.2-2.7 4.4M12 17v.2"/></svg></button>
    </div></nav>
    <section class="game" aria-label="Daily challenge">
      <div class="stage-heading"><div><p class="eyebrow" id="phase-label"></p><h2 id="instruction"></h2></div><div class="clock"><strong id="clock" aria-label="Elapsed memorisation time">00:00</strong></div></div>
      <p class="stage-detail" id="detail"></p>
      <div id="community" class="community" aria-label="Shared cards" hidden><span class="plaque pointed-plaque"><span lang="ko">공유 카드</span><span class="plaque-translation">Shared cards</span></span><div id="community-cards" class="community-cards"></div></div>
      <div id="board" class="board" aria-label="Memory card grid"></div>
      <div id="action-area" class="action-area"></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="results" hidden></section>
    </section>
  </main>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><h2 id="modal-title"></h2><button id="close-modal" class="icon-button" aria-label="Close dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="modal-body"></div></dialog>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
